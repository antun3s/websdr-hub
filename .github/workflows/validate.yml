name: Validate Catalog

on:
  pull_request:
    paths:
      - "data/stations/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o bin/websdrctl ./cmd/websdrctl

      - name: Validate stations
        run: ./bin/websdrctl validate

      - name: Run tests
        run: go test ./...