name: Health Check & Deploy

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC
    - cron: "0 18 * * *"  # 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o bin/websdrctl ./cmd/websdrctl

      - name: Generate stations.json
        run: ./bin/websdrctl build

      - name: Health check
        run: |
          PREV_URL="https://${{ github.repository_owner }}.github.io/websdr-directory/v1/status.json"
          ./bin/websdrctl check \
            -prev "$PREV_URL" \
            -vantage "gh-actions" \
            -out dist/v1/status.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4