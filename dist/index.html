<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSDR Directory</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --radius: 6px;
}

:root.light {
  --bg: #ffffff;
  --surface: #f6f8fa;
  --border: #d0d7de;
  --text: #1f2328;
  --text-muted: #656d76;
  --green: #1a7f37;
  --red: #cf222e;
  --yellow: #9a6700;
  --blue: #0969da;
  --purple: #8250df;
}

@media (prefers-color-scheme: light) {
  :root:not(.dark) {
    --bg: #ffffff;
    --surface: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #656d76;
    --green: #1a7f37;
    --red: #cf222e;
    --yellow: #9a6700;
    --blue: #0969da;
    --purple: #8250df;
  }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}

header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { font-size: 1.2rem; font-weight: 600; }
header .subtitle { font-size: 0.8rem; color: var(--text-muted); }
#theme-btn {
  position: absolute;
  top: 14px;
  right: 20px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 2px 8px;
  line-height: 1.5;
}
#theme-btn:hover { color: var(--text); border-color: var(--text-muted); }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  align-items: flex-end;
  position: sticky;
  top: 53px;
  z-index: 9;
  transition: transform 0.3s ease;
}
.filters.collapsed { transform: translateY(calc(-100% - 12px)); }
@media (min-width: 768px) { .filters.collapsed { transform: none; } }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
.filter-group select { display: block; }
.filter-group input[type=number] {
  display: block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 4px 8px;
  font-size: 0.8rem;
  width: 110px;
}
.filter-group input[type=number]:focus { outline: 1px solid var(--blue); }
.filter-group input[type=number]::placeholder { color: var(--text-muted); }
.filter-group input { display: none; }

.filter-group select,
.filter-group .chk-group {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 4px 8px;
  font-size: 0.8rem;
  min-width: 100px;
}
.filter-group select:focus { outline: 1px solid var(--blue); }

.chk-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chk-group label.chk {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: normal;
}
.chk-group input[type=checkbox] { display: inline; accent-color: var(--blue); }
.chk-group input[type=checkbox]:checked + span { color: var(--text); }

.counter {
  padding: 10px 20px;
  font-size: 0.8rem;
  color: var(--text-muted);
}
.counter strong { color: var(--text); }

#loader {
  display: flex;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.spinner {
  width: 24px; height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#error {
  display: none;
  text-align: center;
  padding: 60px 20px;
}
#error p { color: var(--red); margin-bottom: 12px; }
#error button {
  background: var(--blue);
  color: #fff;
  border: none;
  padding: 8px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.85rem;
}
#error button:hover { opacity: 0.9; }

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 12px 20px 40px;
}
@media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--text-muted); }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}
.card-name {
  font-size: 0.95rem;
  font-weight: 600;
  word-break: break-word;
}
.card-name a {
  color: var(--text);
  text-decoration: none;
}
.card-name a:hover { color: var(--blue); }

.status-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 3px;
}
.status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }
.status-dot.unknown { background: var(--text-muted); }

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.7rem;
  font-weight: 500;
}
.badge.websdr { background: #1f6feb33; color: var(--blue); border: 1px solid #1f6feb55; }
.badge.kiwisdr { background: #8957e533; color: var(--purple); border: 1px solid #8957e555; }
.badge.openwebrx { background: #3fb95033; color: var(--green); border: 1px solid #3fb95055; }
.badge.phantomsdr { background: #d2991d33; color: var(--yellow); border: 1px solid #d2991d55; }
.badge.other { background: #8b949e33; color: var(--text-muted); border: 1px solid #8b949e55; }

.card-bands {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  line-height: 1.4;
}

.card-status {
  font-size: 0.75rem;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.card-status.online-text { color: var(--green); }
.card-status.offline-text { color: var(--red); }
.card-status.unknown-text { color: var(--text-muted); }

footer {
  text-align: center;
  padding: 16px;
  font-size: 0.75rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}
footer a { color: var(--blue); text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>WebSDR Directory</h1>
  <div class="subtitle" id="updated">Loading...</div>
  <button id="theme-btn">☀️</button>
</header>

<nav class="filters">
  <div class="filter-group">
    <label for="f-status">Status</label>
    <select id="f-status">
      <option value="">All</option>
      <option value="online">Online</option>
      <option value="offline">Offline</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Software</label>
    <div class="chk-group" id="f-software"></div>
  </div>

  <div class="filter-group">
    <label for="f-country">Country</label>
    <select id="f-country"><option value="">All</option></select>
  </div>

  <div class="filter-group">
    <label for="f-band">Band</label>
    <select id="f-band"><option value="">All</option></select>
  </div>

  <div class="filter-group">
    <label for="f-lang">Language</label>
    <select id="f-lang"><option value="">All</option></select>
  </div>

  <div class="filter-group">
    <label for="f-freq">Freq (kHz)</label>
    <input type="number" id="f-freq" min="0" placeholder="ex: 7100">
  </div>
</nav>

<div class="counter" id="counter"></div>

<main id="loader">
  <div class="spinner"></div>
  <span>Loading stations...</span>
</main>

<div id="error">
  <p id="error-msg"></p>
  <button onclick="location.reload()">Retry</button>
</div>

<div class="grid" id="grid" style="display:none"></div>

<footer>
  <a href="https://github.com/websdrdir/websdr-directory">github.com/websdrdir/websdr-directory</a>
</footer>

<script>
const API_STATIONS = "./v1/stations.json";
const API_STATUS = "./v1/status.json";

let allStations = [];
let statusData = {};
let generatedAt = "";

function applyTheme(theme) {
  const root = document.documentElement;
  root.classList.remove("light", "dark");
  if (theme === "light") root.classList.add("light");
  if (theme === "dark") root.classList.add("dark");
  themeBtn.textContent = theme === "light" ? "🌙" : "☀️";
}

function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved) {
    applyTheme(saved);
  } else {
    const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
    themeBtn.textContent = prefersLight ? "🌙" : "☀️";
  }
}

const loader = document.getElementById("loader");
const errorEl = document.getElementById("error");
const errorMsg = document.getElementById("error-msg");
const grid = document.getElementById("grid");
const counter = document.getElementById("counter");
const updated = document.getElementById("updated");
const fStatus = document.getElementById("f-status");
const fSoftware = document.getElementById("f-software");
const fCountry = document.getElementById("f-country");
const fBand = document.getElementById("f-band");
const fLang = document.getElementById("f-lang");
const fFreq = document.getElementById("f-freq");
const themeBtn = document.getElementById("theme-btn");
const softwareValues = ["websdr", "kiwisdr", "openwebrx", "phantomsdr", "other"];

function showLoading() {
  loader.style.display = "flex";
  errorEl.style.display = "none";
  grid.style.display = "none";
}
function showError(msg) {
  loader.style.display = "none";
  errorEl.style.display = "block";
  errorMsg.textContent = msg;
  grid.style.display = "none";
}
function showGrid() {
  loader.style.display = "none";
  errorEl.style.display = "none";
  grid.style.display = "grid";
}

function flagEmoji(iso) {
  if (!iso || iso.length !== 2) return iso || "?";
  const a = 0x1F1E6 - 65;
  return String.fromCodePoint(a + iso.charCodeAt(0), a + iso.charCodeAt(1));
}

function freqLabel(hz) {
  if (hz >= 1e9) return (hz / 1e9).toFixed(1) + " GHz";
  if (hz >= 1e6) return (hz / 1e6).toFixed(0) + " MHz";
  if (hz >= 1e3) return (hz / 1e3).toFixed(0) + " kHz";
  return hz + " Hz";
}

function bandLabel(band) {
  return band.name + " (" + freqLabel(band.start_hz) + "–" + freqLabel(band.stop_hz) + ") " + band.modes.join("/");
}

function timeAgo(ts) {
  if (!ts) return "";
  const diff = (Date.now() - new Date(ts).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

function renderStations() {
  const statusVal = fStatus.value;
  const checkedSW = softwareValues.filter(v => document.getElementById("sw-" + v)?.checked);
  const countryVal = fCountry.value;
  const bandVal = fBand.value;
  const langVal = fLang.value;
  const freqVal = fFreq.value.trim();
  const freqHz = freqVal ? parseInt(freqVal, 10) * 1000 : 0;

  let activeFilters = 0;
  if (statusVal) activeFilters++;
  if (checkedSW.length > 0 && checkedSW.length < softwareValues.length) activeFilters++;
  if (countryVal) activeFilters++;
  if (bandVal) activeFilters++;
  if (langVal) activeFilters++;
  if (freqVal) activeFilters++;

  const filtered = allStations.filter(st => {
    if (statusVal) {
      const s = statusData[st.id];
      if (statusVal === "online" && (!s || s.state !== "online")) return false;
      if (statusVal === "offline" && s && s.state === "online") return false;
    }
    if (checkedSW.length > 0 && !checkedSW.includes(st.software)) return false;
    if (countryVal && st.location.country !== countryVal) return false;
    if (bandVal && !st.coverage.some(b => b.name === bandVal)) return false;
    if (langVal && !st.languages.includes(langVal)) return false;
    if (freqHz > 0 && !st.coverage.some(b => b.start_hz <= freqHz && freqHz <= b.stop_hz)) return false;
    return true;
  });

  let html = "";
  for (const st of filtered) {
    const s = statusData[st.id];
    const online = s && s.state === "online";
    const statusClass = s ? (online ? "online" : "offline") : "unknown";
    const statusTextClass = s ? (online ? "online-text" : "offline-text") : "unknown-text";

    let statusLine = "";
    if (online) {
      statusLine = "Online · " + (s.latency_ms != null ? s.latency_ms + "ms · " : "") + "checked " + timeAgo(s.checked_at);
    } else if (s) {
      statusLine = "Offline";
      if (s.consecutive_failures > 1) statusLine += " · " + s.consecutive_failures + " failures";
      if (s.last_online) statusLine += " · last online " + timeAgo(s.last_online);
      else statusLine += " · checked " + timeAgo(s.checked_at);
    } else {
      statusLine = "Status unknown";
    }

    html += '<article class="card">' +
      '<div class="card-header">' +
        '<span class="card-name"><a href="' + escapeHTML(st.url) + '" target="_blank" rel="noopener">' + escapeHTML(st.name) + '</a></span>' +
        '<span class="status-dot ' + statusClass + '" title="' + (online ? "Online" : s ? "Offline" : "Unknown") + '"></span>' +
      '</div>' +
      '<div class="card-meta">' +
        flagEmoji(st.location.country) + ' ' + escapeHTML(st.location.city) + ', ' + escapeHTML(st.location.country) +
        ' · <span class="badge ' + escapeHTML(st.software) + '">' + escapeHTML(st.software) + '</span>' +
        (st.operator ? ' · ' + escapeHTML(st.operator) : '') +
      '</div>' +
      '<div class="card-bands">' + st.coverage.map(bandLabel).join("<br>") + '</div>' +
      '<div class="card-status ' + statusTextClass + '">' + statusLine + '</div>' +
    '</article>';
  }

  grid.innerHTML = html;

  if (activeFilters > 0) {
    counter.innerHTML = "<strong>" + filtered.length + "</strong> stations &middot; " + activeFilters + " filter" + (activeFilters > 1 ? "s" : "") + " active";
  } else {
    counter.innerHTML = "<strong>" + filtered.length + "</strong> stations";
  }
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function populateDropdowns() {
  const countries = new Set();
  const bands = new Set();
  const langs = new Set();
  for (const st of allStations) {
    countries.add(st.location.country);
    for (const b of st.coverage) bands.add(b.name);
    for (const l of st.languages) langs.add(l);
  }

  [fCountry, fBand, fLang].forEach(sel => { while (sel.options.length > 1) sel.remove(1); });
  [...countries].sort().forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = flagEmoji(c) + " " + c; fCountry.appendChild(o); });
  [...bands].sort().forEach(b => { const o = document.createElement("option"); o.value = b; o.textContent = b; fBand.appendChild(o); });
  [...langs].sort().forEach(l => { const o = document.createElement("option"); o.value = l; o.textContent = l.toUpperCase(); fLang.appendChild(o); });
}

function populateSoftwareCheckboxes() {
  fSoftware.innerHTML = "";
  for (const sw of softwareValues) {
    const lbl = document.createElement("label");
    lbl.className = "chk";
    const inp = document.createElement("input");
    inp.type = "checkbox";
    inp.id = "sw-" + sw;
    inp.checked = false;
    inp.addEventListener("change", renderStations);
    const span = document.createElement("span");
    span.textContent = sw;
    lbl.appendChild(inp);
    lbl.appendChild(span);
    fSoftware.appendChild(lbl);
  }
}

[fStatus, fCountry, fBand, fLang].forEach(el => el.addEventListener("change", renderStations));
fFreq.addEventListener("input", renderStations);

async function init() {
  initTheme();
  themeBtn.addEventListener("click", () => {
    const root = document.documentElement;
    const isDark = root.classList.contains("dark") || (!root.classList.contains("light") && !root.classList.contains("dark") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const next = isDark ? "light" : "dark";
    localStorage.setItem("theme", next);
    applyTheme(next);
  });
  showLoading();
  const filters = document.querySelector(".filters");
  let lastScrollY = 0;
  window.addEventListener("scroll", () => {
    const now = window.scrollY;
    if (now > 60 && now > lastScrollY) filters.classList.add("collapsed");
    else filters.classList.remove("collapsed");
    lastScrollY = now;
  }, { passive: true });
  try {
    const [stationsRes, statusRes] = await Promise.all([
      fetch(API_STATIONS),
      fetch(API_STATUS)
    ]);

    if (!stationsRes.ok) throw new Error("Failed to load stations: HTTP " + stationsRes.status);
    const stationsData = await stationsRes.json();
    allStations = stationsData.stations || [];
    updated.textContent = "Catalog: " + (stationsData.generated_at ? new Date(stationsData.generated_at).toLocaleString() : "unknown");

    if (statusRes.ok) {
      const sData = await statusRes.json();
      statusData = sData.stations || {};
      if (sData.generated_at) {
        updated.textContent += " · Status: " + new Date(sData.generated_at).toLocaleString();
      }
    } else {
      updated.textContent += " · Status: unavailable";
    }

    populateDropdowns();
    populateSoftwareCheckboxes();
    showGrid();
    renderStations();
  } catch (err) {
    showError(err.message || "Could not load station data. Check your connection.");
  }
}

init();
</script>
</body>
</html>
